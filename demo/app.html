<!doctype html><meta charset="utf-8"><title>beep app</title>
<button id="start">start</button>
<script>
let ctx;
document.getElementById("start").onclick = () => {
  ctx = new AudioContext();
  const master = ctx.createGain(); master.gain.value = 0.3; master.connect(ctx.destination);
  // three notes, 0.4s apart: A4, C#5, E5
  [440, 554.37, 659.25].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    const t = ctx.currentTime + 0.2 + i * 0.4;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
  });
};
</script>
